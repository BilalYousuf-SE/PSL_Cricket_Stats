server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # React Router uses client-side routing, so any path that isn't a real
    # file (e.g. /matches/123) must fall back to index.html and let the
    # router handle it, or a hard refresh on a deep link would 404.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
